
<div class="login-page">

  <!-- Background -->
  <div class="background">
    <div class="background-circle circle-one"></div>
    <div class="background-circle circle-two"></div>
    <div class="background-circle circle-three"></div>
  </div>

  <!-- Main Content -->
  <main class="login-container">

    <!-- Brand -->
    <div class="brand">

      <div class="brand-mark">
        <div class="tree tree-one"></div>
        <div class="tree tree-two"></div>
        <div class="tree tree-three"></div>
      </div>

      <div class="brand-name">
        <span>NH</span>Park
      </div>

    </div>


    <!-- Login Card -->
    <div class="login-card">

      <div class="login-header">

        <span class="welcome-label">
          PARK MANAGEMENT SYSTEM
        </span>

        <h1>Welcome back.</h1>

        <p>
          Sign in to manage your reservations and
          park visits.
        </p>

      </div>


      <!-- Error -->
      <div
        class="error-message"
        *ngIf="errorMessage"
      >
        <div class="error-icon">!</div>
        <span>{{ errorMessage }}</span>
      </div>


      <!-- Form -->
      <form (ngSubmit)="login()">

        <!-- Username -->
        <div class="form-group">

          <label for="username">
            Username
          </label>

          <div class="input-container">

            <svg
              class="input-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
            >
              <path
                d="M20 21a8 8 0 0 0-16 0"
              />
              <circle
                cx="12"
                cy="7"
                r="4"
              />
            </svg>

            <input
              id="username"
              name="username"
              type="text"
              [(ngModel)]="username"
              placeholder="Enter your username"
              autocomplete="username"
              required
            />

          </div>

        </div>


        <!-- Email -->
        <div class="form-group">

          <label for="email">
            Email address
          </label>

          <div class="input-container">

            <svg
              class="input-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
            >
              <rect
                x="3"
                y="5"
                width="18"
                height="14"
                rx="2"
              />

              <path
                d="m3 7 9 6 9-6"
              />
            </svg>

            <input
              id="email"
              name="email"
              type="email"
              [(ngModel)]="email"
              placeholder="Enter your email"
              autocomplete="email"
              required
            />

          </div>

        </div>


        <!-- Password -->
        <div class="form-group">

          <div class="label-row">

            <label for="password">
              Password
            </label>

            <a href="#" class="forgot-link">
              Forgot password?
            </a>

          </div>

          <div class="input-container">

            <svg
              class="input-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
            >
              <rect
                x="4"
                y="10"
                width="16"
                height="11"
                rx="2"
              />

              <path
                d="M8 10V7a4 4 0 0 1 8 0v3"
              />
            </svg>

            <input
              id="password"
              name="password"
              type="password"
              [(ngModel)]="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            />

          </div>

        </div>


        <!-- Remember -->
        <div class="form-options">

          <label class="remember">

            <input
              type="checkbox"
            />

            <span class="checkmark"></span>

            <span>
              Keep me signed in
            </span>

          </label>

        </div>


        <!-- Submit -->
        <button
          type="submit"
          class="login-button"
          [disabled]="loading"
        >

          <span *ngIf="!loading">
            Sign in
          </span>

          <span *ngIf="loading">
            Signing in...
          </span>

          <svg
            *ngIf="!loading"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M5 12h14" />
            <path d="m13 6 6 6-6 6" />
          </svg>

        </button>

      </form>


      <!-- Create Account -->
      <div class="create-account">

        <span>
          New to NhPark?
        </span>

      
         <a routerLink="/create-account" class="get-started">
          Create an account
        </a>
      </div>

    </div>


    <!-- Footer -->
    <footer>

      <span>
        © 2026 NhPark
      </span>

      <span class="footer-dot"></span>

      <span>
        Park Booking & Management
      </span>

    </footer>

  </main>

</div>
