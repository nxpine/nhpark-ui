<div class="create-account-page">

  <div class="create-account-card">

    <div class="welcome-panel">

      <div class="logo">
        <div class="logo-icon">
          <span></span>
          <span></span>
          <span></span>
        </div>

        <span class="logo-text">
          NH<span>Park</span>
        </span>
      </div>

      <div class="welcome-content">

        <div class="small-title">
          PARK BOOKING SYSTEM
        </div>

        <h1>
          Create your
          <span>NhPark</span>
          account.
        </h1>

        <p>
          Create an account to manage your
          park bookings, vehicles, and
          customer information.
        </p>

      </div>

      <div class="copyright">
        © 2026 NhPark
      </div>

    </div>


    <div class="form-panel">

      <div class="form-content">

        <div class="form-label">
          CREATE ACCOUNT
        </div>

        <h2>
          Get started
        </h2>

        <p class="subtitle">
          Create your NhPark account.
        </p>


        <form (submit)="createAccount()">

          <div class="input-group">

            <label>
              Username
            </label>

            <input
              type="text"
              name="username"
              placeholder="Enter your username"
              required
            >

          </div>


          <div class="input-group">

            <label>
              Email
            </label>

            <input
              type="email"
              name="email"
              placeholder="Enter your email"
              required
            >

          </div>


          <div class="input-group">

            <label>
              Password
            </label>

            <input
              type="password"
              name="password"
              placeholder="Create a password"
              required
            >

          </div>


          <div class="input-group">

            <label>
              Confirm Password
            </label>

            <input
              type="password"
              name="confirmPassword"
              placeholder="Confirm your password"
              required
            >

          </div>


          <button type="submit">
            Create Account
          </button>

        </form>


        <div class="login-link">

          <span>
            Already have an account?
          </span>

          <button
            type="button"
            (click)="goToLogin()"
          >
            Sign in
          </button>

        </div>

      </div>

    </div>

  </div>

</div>
